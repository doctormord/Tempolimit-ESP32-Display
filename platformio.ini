; ============================================================================
; Tempolimit-Anzeige - PlatformIO
;
; Firmware:  pio run -e esp32s3 -t upload
; Simulator: cmake -S sim -B build-sim && cmake --build build-sim -j
;            ./build-sim/tempolimit-sim
;
; Ordnerstruktur:
;   platformio.ini
;   include/lv_conf.h        (aus lvgl/lv_conf_template.h kopiert, angepasst)
;   src/main.cpp             (der Sketch, aus .ino umbenannt)
;   src/ui.c  src/ui.h       (gemeinsame Oberflaeche)
;   src/speedlimit_grid.h    (Kartenlookup, sobald SD dazukommt)
;   sim/sim_main.c           (nur fuer den PC-Simulator)
; ============================================================================

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; ESP32-S3-DevKitC-1 mit N16R8 (16 MB Flash, 8 MB Octal-PSRAM)
; ---------------------------------------------------------------------------
[env:esp32s3]
; Die offizielle PlatformIO-Plattform bleibt beim alten Arduino-Core 2.x.
; Fuer Core 3.x braucht es den Community-Fork pioarduino.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; qio_opi = QSPI-Flash + Octal-PSRAM. Ohne das findet ps_malloc() nichts.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Eigene Tabelle: App-Slots auf 1,5 MiB geschrumpft, Dateisystem dafuer
; 12,875 MiB statt 6,875. Begruendung steht in der Datei selbst.
board_build.partitions = partitions_maps_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Absoluter Pfad zur lv_conf.h - verlaesslicher als LV_CONF_INCLUDE_SIMPLE,
    ; weil der Suchpfad beim Uebersetzen der LVGL-Bibliothek sonst nicht greift
    -DLV_CONF_PATH='"${platformio.include_dir}/lv_conf.h"'
    -DARDUINO_USB_MODE=1
    ; 0 = Serial geht auf UART0 und damit ueber den USB-Bruecken-Chip am
    ; UART-Port - derselbe Port, ueber den auch geflasht wird. Bei 1 landet
    ; Serial auf dem nativen USB-Port (GPIO19/20); dann bleibt der Monitor am
    ; UART-Port stumm.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I include
    -O2
    -DUSE_DIN_FONT

build_src_filter = +<*> -<../sim/>

lib_deps =
    lvgl/lvgl@^9.2.0
    moononournation/GFX Library for Arduino@^1.5.0
    mikalhart/TinyGPSPlus@^1.1.0

; Der PC-Simulator wird NICHT ueber PlatformIO gebaut, sondern ueber CMake
; (sim/CMakeLists.txt). Grund: PlatformIO kennt SDL2 nicht und man muesste
; die Homebrew-Pfade von Hand eintragen. CMake findet sie selbst:
;     brew install sdl2 cmake
;     cmake -S sim -B build-sim && cmake --build build-sim -j
;     ./build-sim/tempolimit-sim
