; ============================================================================
; Speed-limit display - PlatformIO
;
; Firmware:  pio run -e esp32s3 -t upload
; Simulator: cmake -S sim -B build-sim && cmake --build build-sim -j
;            ./build-sim/tempolimit-sim
;
; Folder layout:
;   platformio.ini
;   include/lv_conf.h        (copied from lvgl/lv_conf_template.h, adjusted)
;   src/main.cpp             (the sketch, renamed from .ino)
;   src/ui.c  src/ui.h       (shared UI)
;   src/speedlimit_grid.h    (map lookup, once SD is added)
;   sim/sim_main.c           (PC simulator only)
; ============================================================================

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; ESP32-S3-DevKitC-1 with N16R8 (16 MB flash, 8 MB octal PSRAM)
; ---------------------------------------------------------------------------
[env:esp32s3]
; The official PlatformIO platform is stuck on the old Arduino core 2.x.
; Core 3.x needs the community fork pioarduino.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; qio_opi = QSPI flash + octal PSRAM. Without it, ps_malloc() returns nothing.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; Custom table: app slots shrunk to 1.5 MiB, filesystem gets 12.875 MiB
; instead of 6.875. Rationale is documented in the file itself.
board_build.partitions = partitions_maps_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Absolute path to lv_conf.h - more reliable than LV_CONF_INCLUDE_SIMPLE,
    ; because the search path otherwise doesn't take effect while compiling
    ; the LVGL library itself
    -DLV_CONF_PATH='"${platformio.include_dir}/lv_conf.h"'
    -DARDUINO_USB_MODE=1
    ; 0 = Serial goes over UART0 and therefore through the USB bridge chip
    ; on the UART port - the same port used for flashing. At 1, Serial ends
    ; up on the native USB port (GPIO19/20); the monitor on the UART port
    ; then stays silent.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I include
    -O2
    -DUSE_DIN_FONT

build_src_filter = +<*> -<../sim/>

lib_deps =
    lvgl/lvgl@^9.2.0
    moononournation/GFX Library for Arduino@^1.5.0
    mikalhart/TinyGPSPlus@^1.1.0

; The PC simulator is NOT built through PlatformIO, but through CMake
; (sim/CMakeLists.txt). Reason: PlatformIO doesn't know about SDL2 and you'd
; have to enter the Homebrew paths by hand. CMake finds them on its own:
;     brew install sdl2 cmake
;     cmake -S sim -B build-sim && cmake --build build-sim -j
;     ./build-sim/tempolimit-sim
